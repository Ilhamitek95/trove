# Render Blueprint — deploys the whole marketplace (API + storefront) as one
# web service. In the Render dashboard: New + → Blueprint → pick this repo.
#
# The Standard plan (1 CPU / 2 GB — sized for ~10K visitors a day) + disk keeps the SQLite database on persistent storage so
# accounts, products and orders survive deploys and restarts.
services:
  - type: web
    name: trove
    runtime: node
    plan: standard
    rootDir: backend
    # With rootDir set, Render would only auto-deploy on changes under backend/,
    # so a push touching only the pages in docs/ never went live (15 Oct had to
    # be deployed by hand). Deploy on the app (backend + docs) and this file;
    # never on social/ (campaign assets) or e2e/.
    buildFilter:
      paths:
        - backend/**
        - docs/**
        - render.yaml
    # npm ci installs exactly what package-lock.json pins (F280) — the same
    # versions the test suite ran against, never a newer patch picked at build.
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: trove-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/trove.db
      # Seller-uploaded images — also on the disk so they survive deploys.
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # Private documents (self-billed purchase notes, license images) — on
      # the disk but NEVER statically served; streamed via authed endpoints.
      - key: PRIVATE_DIR
        value: /var/data/private
      # SEED_DEMO (demo catalogue on an empty database) is development-only and
      # is ignored when NODE_ENV=production — never set it here (it can be
      # deleted from the live Environment tab too).
      - key: SESSION_SECRET
        generateValue: true
      # The server refuses to start in production without SESSION_SECRET.
      #
      # Secrets and settings the live service needs, declared so that a
      # service rebuilt from this Blueprint asks for each one (F280). sync:false
      # never sends or changes a value: the live values stay as set in the
      # dashboard (Environment tab). Values: the owner's password manager.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLIENT_URL           # https://troveathome.com (Stripe return links, allowed origin)
        sync: false
      - key: ADMIN_EMAIL          # the owner's sign-in; the only admin
        sync: false
      - key: PAYOUT_ENC_KEY       # IRREPLACEABLE — encrypts stored IBANs; never rotate
        sync: false
      - key: RESEND_API_KEY       # transactional email
        sync: false
      - key: EMAIL_FROM           # e.g. Trove <noreply@troveathome.com>
        sync: false
      - key: OTO_REFRESH_TOKEN    # courier gateway; mock delivery without it
        sync: false
      - key: OTO_WEBHOOK_SECRET
        sync: false
      - key: BACKUP_S3_ENDPOINT   # off-site backups (Cloudflare R2), see RESTORE.md
        sync: false
      - key: BACKUP_S3_BUCKET
        sync: false
      - key: BACKUP_S3_KEY_ID
        sync: false
      - key: BACKUP_S3_SECRET
        sync: false
      - key: BACKUP_ENC_KEY       # keep a copy in the password manager
        sync: false
      - key: VAT_REGISTERED
        sync: false
      # Also set on the live service when used (not declared here, so a
      # Blueprint sync never touches them): ANTHROPIC_API_KEY, GOOGLE_CLIENT_ID,
      # CONTACT_EMAIL, PUBLIC_URL, and the Didit identity checks: DIDIT_API_KEY,
      # DIDIT_WORKFLOW_ID, DIDIT_WEBHOOK_SECRET (delete the key = photo route only).
      # Added later in the dashboard (Environment tab):
      #   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET  (pk_ key goes in docs/config.js)
      #   PAYOUT_ENC_KEY   64 hex chars — REQUIRED before suppliers can complete
      #                    payout setup or settlement CSVs can be exported.
      #                    Generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      #   EMAIL_REPLY_TO   a mailbox that really receives mail (hello@troveathome.com
      #                    once forwarding exists); unset = emails stay no-reply
      #   BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET, BACKUP_S3_KEY_ID, BACKUP_S3_SECRET,
      #   BACKUP_ENC_KEY   encrypted nightly off-site copy of the database, photos
      #                    and private documents (Cloudflare R2 / any S3). Setup
      #                    and restore steps: RESTORE.md. Keep BACKUP_ENC_KEY in a
      #                    password manager too. Optional: BACKUP_S3_REGION,
      #                    BACKUP_S3_PREFIX, BACKUP_REMOTE_KEEP (14), BACKUP_WEEKLY_EMAIL=0
      #   RAIL_B_ENABLED   leave unset/0 until the Stripe Connect rail is cleared
      #   VAT_REGISTERED   set to 1 once Trove is VAT-registered
      #   GRADUATION_THRESHOLD_AED, COMMISSION_PERCENT  (defaults 12000 / 40)
      #   OTO_REFRESH_TOKEN  courier gateway (tryoto.com → Settings → API Integrations);
      #                      mock delivery until set. OTO_WEBHOOK_SECRET signs its webhooks.
      #                      Optional: OTO_DELIVERY_OPTION_ID, OTO_SERVICE_TYPE, OTO_PARCEL_KG/CM
      #   QUIQUP_CLIENT_ID, QUIQUP_CLIENT_SECRET, QUIQUP_WEBHOOK_SECRET  (old courier, fallback)
      #   ANTHROPIC_API_KEY  switches on Claude-written tag suggestions in the
      #                      seller dashboard (console.anthropic.com → API keys)
      #   AI_TAGS_MODEL      Claude model for tag suggestions (default
      #                      claude-haiku-4-5; e.g. claude-sonnet-5, claude-opus-4-8)
      #   GOOGLE_CLIENT_ID   switches on Sign in with Google on the login page
      #                      (GCP project "Trove" → Google Auth Platform → Clients)
