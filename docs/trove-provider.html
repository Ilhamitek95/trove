<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Trove · Provider dashboard</title>
<meta name="trove-i18n" content="provider">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  em,i,cite{font-style:normal} /* brand: no italics anywhere, not even the browser default */
  :root{
    --font-display:'Cormorant',Georgia,serif;
    --rose:#DBC7BD; --coral:#F19A82; --accent-ink:#292727; --cream:#FDF7F5;
    --sage:#CAD5CC; --char:#292727; --taupe:#BD9C8C; --paper:#FFFCFA;
    --rose-tint:#F2E9E4; --sage-tint:#E9EFEA;
    --line:rgba(41,39,39,.12); --muted:rgba(41,39,39,.72); /* .72 = 5.8:1 on cream (WCAG AA) */ --ink-80:rgba(41,39,39,.78);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Quicksand',system-ui,sans-serif;background:var(--cream);color:var(--char);-webkit-font-smoothing:antialiased;font-weight:500}
  ::selection{background:var(--rose);color:var(--char)}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  h1,h2,h3,h4{font-family:var(--font-display);font-weight:500}

  .gate{min-height:100vh;display:grid;place-items:center;font-size:14px;color:var(--muted);font-weight:600}
  .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  .side{border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:4px;background:var(--paper)}
  .side .logo{font-family:var(--font-display);font-size:26px;font-weight:600;margin-bottom:4px;padding:0 10px}
  .side .logo span{font-size:11px;font-family:'Quicksand',sans-serif;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-left:7px;white-space:nowrap}
  .side .logo a{text-decoration:none}
  .who{display:flex;gap:10px;align-items:center;padding:10px;margin-bottom:8px}
  .who .av{width:34px;height:34px;border-radius:50%;background:var(--rose);display:grid;place-items:center;font-weight:700;font-size:14px}
  .who .nm{font-size:13px;font-weight:700}
  .who .rl{font-size:11px;color:var(--muted);font-weight:600}
  .mitem{display:flex;gap:11px;align-items:center;padding:11px 12px;border-radius:12px;font-size:13.5px;font-weight:600;color:var(--ink-80);cursor:pointer;transition:.15s}
  .mitem svg{width:17px;height:17px;stroke-width:1.7}
  .mitem:hover{background:var(--rose-tint)}
  .mitem.on{background:var(--char);color:var(--cream)}
  .badge{margin-left:auto;background:var(--rose);color:var(--char);font-size:10.5px;font-weight:700;min-width:19px;height:19px;border-radius:999px;display:grid;place-items:center;padding:0 5px}
  .badge.zero{display:none}
  .sfoot{margin-top:auto;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .sfoot a{cursor:pointer;padding:4px 0}
  .sfoot a:hover{color:var(--char)}
  main{padding:30px 34px 60px;max-width:1060px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .top h1{font-size:34px}
  .top .sub{font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
  .view{display:none}
  .view.active{display:block}
  .mtabs{display:none}
  .btn{display:inline-block;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;transition:.15s;text-align:center;cursor:pointer}
  .btn-dark{background:var(--char);color:var(--cream)}
  .btn-dark:hover{background:#3B3737}
  .shopnote{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:12px 16px;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:18px}
  .shopnote a{text-decoration:underline;color:var(--char)}
  .mbar{display:none}
  @media(max-width:820px){
    .shell{grid-template-columns:1fr}
    .side{display:none}
    /* phones: wordmark, who you are, the way out and the links the sidebar held */
    .mbar{display:block;padding:12px 20px 10px;margin:-22px -20px 0;background:var(--paper);border-bottom:1px solid var(--line)}
    .mbar .row{display:flex;align-items:center;gap:12px}
    .mbar .mlogo{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1;display:inline-flex;align-items:center;min-height:44px}
    .mbar .mlogo img{height:22px;width:auto;display:block}
    .mbar .mwho{margin-left:auto;text-align:right;min-width:0}
    .mbar .mwho .nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48vw}
    .mbar .mwho .rl{font-size:11px;color:var(--muted);font-weight:600}
    .mbar .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .mbar .links a,.mbar .links button{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;background:var(--cream);cursor:pointer}
    .mtabs{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:20;margin:0 -20px 18px}
    .mtabs .mitem{white-space:nowrap;padding:0 16px;min-height:44px;border:1px solid var(--line);border-radius:999px}
    main{padding:22px 20px 50px}
    .btn{min-height:44px}
  }
  /* ---- accessibility ---- */
  :focus-visible{outline:2px solid var(--char);outline-offset:2px}
  .mitem.on:focus-visible{outline-offset:3px}
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--char)!important;outline-offset:1px}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--char);color:var(--cream);padding:12px 22px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80}
  .toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<div class="gate" id="gate">Checking access…</div>

<div class="shell" id="shell" style="display:none">
  <aside class="side">
    <div class="logo"><a href="/services" aria-label="Trove Services Marketplace">trove</a><span>services</span></div>
    <div class="who"><div class="av" id="whoAv" aria-hidden="true"></div><div><div class="nm" id="whoName"></div><div class="rl" id="whoStatus">Provider</div></div></div>
    <nav aria-label="Dashboard" style="display:contents"><a class="mitem on" href="#overview" data-v="overview" onclick="go('overview');return false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Overview</a>
    <a class="mitem" href="#services" data-v="services" onclick="go('services');return false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2.5 14.9 8.6l6.6.9-4.8 4.6 1.2 6.6L12 17.6l-5.9 3.1 1.2-6.6L2.5 9.5l6.6-.9z"/></svg>My services</a>
    <a class="mitem" href="#bookings" data-v="bookings" onclick="go('bookings');return false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2.5V6M16 2.5V6"/></svg>Bookings<span class="badge zero" id="bkBadge">0</span></a></nav>
    <div class="sfoot">
      <a href="/services" target="_blank" rel="noopener">View the Services Marketplace ↗</a>
      <a href="/sell" id="shopLink" style="display:none">Your shop dashboard ↗</a>
      <a href="/login" onclick="signOut();return false">Sign out</a>
    </div>
  </aside>
  <main>
    <div class="mbar" id="mbar"><div class="row"><a class="mlogo" href="/services" aria-label="Trove Services Marketplace">trove</a>
      <div class="mwho"><div class="nm" id="mWhoName"></div><div class="rl" id="mWhoStatus"></div></div></div>
      <div class="links"><a href="/services" target="_blank" rel="noopener">Marketplace ↗</a><a href="/sell" id="mShopLink" style="display:none">Shop dashboard</a><button type="button" onclick="signOut()">Sign out</button></div></div>
    <nav class="mtabs" id="mtabs" aria-label="Dashboard"></nav>
    <div class="top"><div><h1 id="pageTitle">Overview</h1><div class="sub" id="pageSub"></div></div><div id="topActions"></div></div>
    <div id="shopNote"></div>
    <div class="view active" id="view-overview"><div id="ppOverview"></div></div>
    <div class="view" id="view-services"><div id="ppServices"></div></div>
    <div class="view" id="view-bookings"><div id="ppBookings"></div></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/config.js"></script>
<script src="/api.js"></script>
<script src="/provider-panel.js"></script>
<script>
const $=id=>document.getElementById(id);
let toastT;function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>$('toast').classList.remove('show'),2400);}

/* ---------------- navigation ---------------- */
const TITLES={overview:['Overview','Your practice at a glance'],services:['My services','What customers can book'],bookings:['Bookings','Requests, confirmed visits and history']};
function go(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  $('view-'+v).classList.add('active');
  document.querySelectorAll('.mitem').forEach(m=>{const on=m.dataset.v===v;m.classList.toggle('on',on);if(on)m.setAttribute('aria-current','page');else m.removeAttribute('aria-current');});
  $('pageTitle').textContent=TITLES[v][0];$('pageSub').textContent=TITLES[v][1];
  $('topActions').innerHTML=v==='services'?'<button class="btn btn-dark" onclick="ProviderPanel.openEditor()">+ Add a service</button>':'';
  window.scrollTo(0,0);
}
function buildMobileTabs(){
  $('mtabs').innerHTML=['overview','services','bookings'].map(v=>
    `<a class="mitem ${v==='overview'?'on':''}" href="#${v}" data-v="${v}" onclick="go('${v}');return false">${TITLES[v][0]}${v==='bookings'?' <span class="badge zero" id="bkBadgeM">0</span>':''}</a>`).join('');
}
function setBadges(s){
  [...document.querySelectorAll('#bkBadge,#bkBadgeM')].forEach(b=>{b.textContent=s.open;b.classList.toggle('zero',!s.open);});
}

function showWho(P){
  const st=P.status==='approved'?'Live provider':P.status==='pending'?'In review':P.status==='rejected'?'Not approved':P.status==='suspended'?'Suspended':P.status;
  $('whoName').textContent=P.name; $('mWhoName').textContent=P.name;
  $('whoAv').textContent=(P.name||'·')[0].toUpperCase();
  $('whoStatus').textContent=st; $('mWhoStatus').textContent=st;
}
/* ---------------- boot ---------------- */
async function signOut(){await TroveAPI.logout();window.location.href='/login';}
(async function boot(){
  let me=null;
  try{me=await TroveAPI.me();}catch(_){}
  if(!me||!me.user){window.location.href='/login';return;}
  if(!me.provider){window.location.href='/apply?for=services';return;}
  try{
    await ProviderPanel.init({toast,onChange:setBadges,onOpenEditor:()=>{if(!$('view-services').classList.contains('active'))go('services');},onProfile:showWho});
  }catch(e){$('gate').textContent=e.message||'Could not load your dashboard — refresh to try again.';return;}
  showWho(ProviderPanel.provider);
  // One account, shop + services: point at the other dashboard.
  if(me.shop){
    $('shopLink').style.display=''; $('mShopLink').style.display='';
    $('shopNote').innerHTML=`<div class="shopnote">You also run <b>${String(me.shop.name||'a shop').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</b> on Trove — your pieces, orders and payouts live in the <a href="/sell">shop dashboard</a>, where this Services tab also appears.</div>`;
  }
  $('gate').style.display='none';$('shell').style.display='grid';
  buildMobileTabs();
  ProviderPanel.mountOverview($('ppOverview'));
  ProviderPanel.mountServices($('ppServices'));
  ProviderPanel.mountBookings($('ppBookings'));
  go('overview');
})();
</script>
</body>
</html>
